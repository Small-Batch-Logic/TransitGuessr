<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TransitGuessr</title>
  <meta name="description" content="How well do you know your transit system? See a Street View and guess where the station is — TTC, Worldwide, and Daily Challenge modes.">
  <meta property="og:title" content="TransitGuessr">
  <meta property="og:description" content="How well do you know your transit system? Guess the station from Street View. TTC, Worldwide, and Daily Challenge modes.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://transitguessr.app">
  <meta property="og:image" content="https://transitguessr.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TransitGuessr">
  <meta name="twitter:description" content="Guess the transit station from Street View. TTC, Worldwide, and Daily Challenge modes.">
  <meta name="twitter:image" content="https://transitguessr.app/og-image.png">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚇</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script>
    const savedTheme = localStorage.getItem('transitguessr_theme') || 'light';
    if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
