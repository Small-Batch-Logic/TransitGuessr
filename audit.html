<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TransitGuessr · Station Curation</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="audit.css">
  <script>
    const savedTheme = localStorage.getItem('transitguessr_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>
  <div id="toast"></div>

  <div id="audit-screen">

    <div class="game-header">
      <div class="header-left">
        <a class="btn-quit" href="./index.html">
          <svg class="quit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Back</span>
        </a>
        <span class="header-divider">|</span>
        <div class="round-info" id="audit-progress">Loading…</div>
      </div>
      <div class="header-center">
        <div class="game-mode-badge">Station Curation</div>
      </div>
      <div class="header-right">
        <div class="round-info" id="audit-station-system"></div>
        <div class="audit-station-name" id="audit-station-name">Loading…</div>
      </div>
    </div>

    <div class="timer-bar-wrap">
      <div class="timer-bar-fill audit-progress-fill" id="audit-progress-bar"></div>
    </div>

    <div class="game-body">

      <div class="photo-panel">
        <div id="audit-pano"></div>
        <div class="photo-loading" id="audit-loading">
          <div class="spinner"></div>
          Loading Street View…
        </div>
      </div>

      <div class="map-panel">
        <div id="audit-map"></div>
        <div class="map-footer">
          <div class="map-hint">Does Street View clearly show the station entrance?</div>
          <button type="button" class="audit-no-btn" id="quick-skip-btn">No</button>
          <button type="button" class="audit-yes-btn" id="quick-verify-btn">Yes, I see it</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="config.local.js" defer></script>
  <script src="audit.js" defer></script>
</body>
</html>
